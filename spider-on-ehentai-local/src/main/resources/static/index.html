<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画廊下载管理</title>
<style>
  :root {
    --bg: #12141a;
    --panel: #1b1e27;
    --panel2: #222634;
    --border: #2e3342;
    --text: #d8dbe4;
    --muted: #8b90a0;
    --accent: #c9a86a;
    --accent2: #7fb4a0;
    --danger: #c97b7b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    padding: 28px 20px 60px;
    max-width: 1080px;
    margin: 0 auto;
  }
  header { margin-bottom: 26px; }
  header h1 {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--accent);
  }
  header p { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
  }
  .card h2 {
    font-size: 15px;
    font-weight: 600;
    color: var(--accent2);
    margin-bottom: 14px;
    letter-spacing: 1px;
  }
  label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
  textarea, input[type="text"], input[type="number"] {
    width: 100%;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 9px 11px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
  }
  textarea { min-height: 110px; resize: vertical; font-family: Consolas, monospace; }
  input:focus, textarea:focus { border-color: var(--accent); }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .row input[type="text"] { flex: 1; min-width: 200px; }
  .row input[type="number"] { width: 90px; }
  button {
    background: var(--accent);
    color: #17181d;
    border: none;
    border-radius: 6px;
    padding: 9px 22px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 1px;
    transition: opacity .15s;
  }
  button:hover { opacity: .85; }
  button.secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
  .switch { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font-size: 13px; color: var(--muted); user-select: none; }
  .switch input { display: none; }
  .switch .track {
    width: 36px; height: 20px; border-radius: 10px;
    background: var(--panel2); border: 1px solid var(--border);
    position: relative; transition: background .2s;
  }
  .switch .track::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--muted); transition: all .2s;
  }
  .switch input:checked + .track { background: var(--accent); border-color: var(--accent); }
  .switch input:checked + .track::after { left: 18px; background: #17181d; }
  .result {
    margin-top: 12px;
    font-size: 12px;
    color: var(--muted);
    min-height: 18px;
    word-break: break-all;
  }
  .result.ok { color: var(--accent2); }
  .result.err { color: var(--danger); }
  .card.full { grid-column: 1 / -1; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
  .toolbar input { max-width: 320px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; white-space: nowrap; }
  td.title { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.path { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .tag { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 11px; }
  .tag.done { background: rgba(127,180,160,.15); color: var(--accent2); }
  .tag.todo { background: rgba(201,168,106,.15); color: var(--accent); }
  .tag.gone { background: rgba(201,123,123,.15); color: var(--danger); }
  .tag.none { background: rgba(139,144,160,.15); color: var(--muted); }
  .op-btn {
    background: none; border: 1px solid var(--border); color: var(--accent2);
    border-radius: 5px; padding: 4px 12px; font-size: 12px; cursor: pointer;
  }
  .op-btn:hover { border-color: var(--accent2); }
  .empty { color: var(--muted); text-align: center; padding: 30px 0; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>画廊下载管理</h1>
  <p>spider-on-ehentai-local · 本地元数据存储于 {savePath}/meta/ehentai.json</p>
</header>

<div class="grid">
  <div class="card">
    <h2>画廊下载</h2>
    <label for="urls">画廊地址（一行一个，支持多个）</label>
    <textarea id="urls" placeholder="https://e-hentai.org/g/123456/x/..."></textarea>
    <div class="row">
      <label class="switch">
        <input type="checkbox" id="isDownload" checked>
        <span class="track"></span>
        <span>立即下载</span>
      </label>
      <button onclick="doDownload()">提交下载</button>
    </div>
    <div class="result" id="downloadResult"></div>
  </div>

  <div class="card">
    <h2>列表页批量下载</h2>
    <label for="pageUrl">列表页地址（搜索/收藏页）</label>
    <input type="text" id="pageUrl" placeholder="https://e-hentai.org/?f_search=...">
    <div class="row">
      <label class="switch">
        <input type="checkbox" id="pageFlag" checked>
        <span class="track"></span>
        <span>下载</span>
      </label>
      <label style="margin-bottom:0">页数 <input type="number" id="pageCount" value="1" min="1"></label>
      <button onclick="doDownloadPage()">批量下载</button>
    </div>
    <div class="result" id="pageResult"></div>
  </div>

  <div class="card full">
    <h2>本地记录</h2>
    <div class="toolbar">
      <input type="text" id="keyword" placeholder="按 id / 标题 / 地址搜索" onkeydown="if(event.key==='Enter')loadList()">
      <button class="secondary" onclick="loadList()">查询</button>
      <button class="secondary" onclick="loadList(true)">刷新</button>
      <span class="result" id="listMeta"></span>
    </div>
    <div id="listWrap"><div class="empty">暂无记录，先下载一个画廊试试</div></div>
  </div>
</div>

<script>
  async function postForm(url, params) {
    const qs = Object.entries(params).map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&');
    const resp = await fetch(url + (qs ? '?' + qs : ''), { method: 'POST' });
    return resp.text();
  }

  function show(el, text, ok) {
    el.textContent = text;
    el.className = 'result ' + (ok ? 'ok' : 'err');
  }

  async function doDownload() {
    const el = document.getElementById('downloadResult');
    const urls = document.getElementById('urls').value.trim();
    if (!urls) { show(el, '请先填写画廊地址', false); return; }
    try {
      const text = await postForm('/download', { url: urls, isDownload: document.getElementById('isDownload').checked });
      const data = JSON.parse(text);
      show(el, (data.message || text) + '（已提交，进度见服务窗口日志）', true);
    } catch (e) {
      show(el, '请求失败：' + e.message, false);
    }
  }

  async function doDownloadPage() {
    const el = document.getElementById('pageResult');
    const url = document.getElementById('pageUrl').value.trim();
    if (!url) { show(el, '请先填写列表页地址', false); return; }
    try {
      const text = await postForm('/downloadPage', {
        url,
        flag: document.getElementById('pageFlag').checked,
        pageCount: parseInt(document.getElementById('pageCount').value) || 1
      });
      show(el, text, true);
    } catch (e) {
      show(el, '请求失败：' + e.message, false);
    }
  }

  function statusTag(eh) {
    if (eh.savePath === '画廊已删除') return '<span class="tag gone">已删除</span>';
    if (eh.finish === 1) return '<span class="tag done">已完成</span>';
    if (eh.finish === 0) return '<span class="tag todo">未完成</span>';
    return '<span class="tag none">未知</span>';
  }

  async function loadList(force) {
    const wrap = document.getElementById('listWrap');
    const meta = document.getElementById('listMeta');
    const keyword = document.getElementById('keyword').value.trim();
    try {
      const resp = await fetch('/local/list?keyword=' + encodeURIComponent(keyword) + '&size=200');
      const data = await resp.json();
      const list = data.list || [];
      meta.textContent = '共 ' + list.length + ' 条' + (keyword ? '（含过滤）' : '');
      if (!list.length) {
        wrap.innerHTML = '<div class="empty">暂无记录</div>';
        return;
      }
      const rows = list.map(eh => `
        <tr>
          <td>${eh.id || ''}</td>
          <td class="title" title="${(eh.title || '').replace(/"/g, '&quot;')}">${eh.title || ''}</td>
          <td>${eh.favcount || ''}</td>
          <td>${eh.cost || ''}</td>
          <td>${statusTag(eh)}</td>
          <td class="path" title="${(eh.savePath || '').replace(/"/g, '&quot;')}">${eh.savePath || ''}</td>
          <td><button class="op-btn" onclick="downloadById('${eh.id}')">下载</button></td>
        </tr>`).join('');
      wrap.innerHTML = `<div style="overflow-x:auto"><table>
        <thead><tr><th>id</th><th>标题</th><th>收藏</th><th>点数</th><th>状态</th><th>保存路径</th><th>操作</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
    } catch (e) {
      meta.textContent = '';
      wrap.innerHTML = '<div class="empty err">加载失败：' + e.message + '</div>';
    }
  }

  async function downloadById(id) {
    if (!confirm('开始下载记录 ' + id + '？')) return;
    try {
      const resp = await fetch('/download/id/' + id);
      const text = await resp.text();
      alert(text);
      loadList(true);
    } catch (e) {
      alert('请求失败：' + e.message);
    }
  }

  loadList();
</script>
</body>
</html>
